name: Build Rokid Maps APKs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build phone and glasses APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :phone:assembleDebug :glasses:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rokid-maps-apks
          path: |
            phone/build/outputs/apk/debug/phone-debug.apk
            glasses/build/outputs/apk/debug/glasses-debug.apk
          if-no-files-found: error
